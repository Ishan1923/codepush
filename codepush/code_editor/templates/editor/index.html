<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CF Local Judge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: white; padding: 20px; }
        .container { display: flex; gap: 20px; }
        .left, .right { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .CodeMirror { height: 500px; border-radius: 5px; font-size: 16px; }
        textarea { height: 150px; background: #2d2d2d; color: white; border: none; padding: 10px; }
        input { padding: 5px; background: #2d2d2d; color: white; border: 1px solid #444; }
        button { padding: 10px; background: #4CAF50; color: white; border: none; cursor: pointer; font-weight: bold; }
        button.github { background: #000000; border: 1px solid #444; }
    </style>
</head>
<body>
    <h2>Codeforces Local Judge</h2>
    
    <div style="margin-bottom: 15px; display: flex; gap: 10px;">
        <input type="text" id="rating" placeholder="Rating (e.g. 800)" value="800">
        <input type="text" id="contest" placeholder="Contest ID (e.g. 1901)" value="1901">
        <input type="text" id="problem" placeholder="Problem (e.g. A)" value="A">
    </div>

    <div class="container">
        <div class="left">
            <textarea id="code-editor">#include &lt;iostream&gt;
using namespace std;

int main() {
    int t;
    cin &gt;&gt; t;
    while(t--) {
        // Your code here
    }
    return 0;
}</textarea>
            <div style="display: flex; gap: 10px;">
                <button onclick="runCode()">Run Code</button>
                <button class="github" onclick="pushCode()">Push to GitHub</button>
            </div>
        </div>
        
        <div class="right">
            <label>Test Input:</label>
            <textarea id="test-input"></textarea>
            <label>Output:</label>
            <textarea id="test-output" readonly></textarea>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
    
    <script>
        // Initialize Editor
        var editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
            mode: "text/x-c++src",
            theme: "dracula",
            lineNumbers: true,
            indentUnit: 4
        });

        function getMetaData() {
            return {
                rating: document.getElementById('rating').value,
                contest: document.getElementById('contest').value,
                problem: document.getElementById('problem').value
            };
        }

        async function runCode() {
            document.getElementById('test-output').value = "Compiling and running...";
            const data = {
                ...getMetaData(),
                code: editor.getValue(),
                input: document.getElementById('test-input').value
            };

            const response = await fetch('/execute/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            document.getElementById('test-output').value = result.output || result.error;
        }

        async function pushCode() {
            const btn = document.querySelector('.github');
            btn.innerText = "Pushing...";
            const response = await fetch('/push/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(getMetaData())
            });
            const result = await response.json();
            alert(result.message);
            btn.innerText = "Push to GitHub";
        }
    </script>
</body>
</html>
